name: media_dart
description: >
  Video probe, thumbnails, transcode (Rust + flutter_rust_bridge). Pure Dart package —
  no Flutter SDK; use media_flutter for the Android plugin (Media3).
version: 0.1.0
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter_rust_bridge: 2.11.1
  media_native_build:
    path: ../tool/native_build
  path: ^1.9.1
  hooks: ^1.0.2
  native_toolchain_rust: ^1.0.3
  code_assets: ^1.0.0
  archive: ^3.6.1
  logging: ^1.3.0

dev_dependencies:
  test: ^1.16.0
  build_runner: ^2.4.7
  ffigen: ^20.1.0
  freezed: ^3.1.0
  freezed_annotation: ^3.1.0
  json_serializable: ^6.7.1

hooks:
  user_defines: {}
