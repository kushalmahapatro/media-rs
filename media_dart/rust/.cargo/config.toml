# Cross-linking for Linux GNU triples (Rust std targets). On Debian/Ubuntu install the non-host arch:
#   x86_64 host:  sudo apt install gcc-aarch64-linux-gnu
#   aarch64 host: sudo apt install gcc-x86-64-linux-gnu

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
