[package]
name = "media"
version = "0.1.2"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "media"

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1.41", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
mediacodec = { path = "../mediacodec" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["std"] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "objc2-core-media",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "AVAsset",
    "AVAssetTrack",
    "AVAssetExportSession",
    "AVAssetImageGenerator",
    "AVMediaFormat",
] }
objc2-core-media = { version = "0.3.2", features = ["CMTime", "objc2"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3.2", features = [
    "CGImage",
    "CGDataProvider",
    "objc2",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "UIImage",
    "UIGraphics",
] }

[profile.release]
# Drop Rust symbol tables from the cdylib (smaller on-disk size; stack traces harder).
strip = true
# Dedup / dead-code elimination across crates (slower release builds, somewhat smaller .so/.dylib).
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(frb_expand)',
    'cfg(media_embed_macos_ffmpeg)',
] }
