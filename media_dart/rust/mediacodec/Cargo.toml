[package]
name = "mediacodec"
version = "0.1.2"
edition = "2021"
authors = ["Adebayo Jagunmolu <hardebahyho@gmail.com>"]
description = "Rust bindings to MediaCodec (vendored rlib for embedding in libmedia)"
license = "MIT"
repository = "https://github.com/hardebayho/rust_mediacodec"
resolver = "2"

[lib]
name = "mediacodec"
crate-type = ["rlib"]

[dependencies]
log = "0.4.14"

[features]
api24 = []
api26 = ["api24"]
api28 = ["api26"]
api29 = ["api28"]

[target.'cfg(target_os = "android")'.dependencies]
android_log = "0.1.3"
javavm = "0.1.2"
jni = "0.19.0"
