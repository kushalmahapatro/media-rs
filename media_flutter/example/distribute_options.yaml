# Fastforge (https://pub.dev/packages/fastforge) — from repo root:
#   dart run melos run dist-apk --no-select
#   dart run melos run dist --no-select   # all jobs
# From this directory:
#   dart run fastforge:main release --name media-example --jobs android-apk
# Or: dart run media_cli dist --jobs android-apk
#
# Output dir must end with `/` so the packager forms `dist/<version>/` (otherwise
# you get `dist0.1.0`). `artifact_name` is a Mustache template — include `.{{ext}}`
# or the file has no .apk/.dmg suffix.
output: ../../dist/
artifact_name: 'media-{{build_name}}-{{platform}}.{{ext}}'

# macOS DMG: YAML under macos/packaging/dmg/make_config.yaml. `media_cli dist`
# prepends tool/shims for `appdmg` / `npx --yes appdmg` (needs Node.js).
#
# Do NOT use Fastforge `macos-pkg`: flutter_app_packager passes `Foo.app` to
# `productbuild --root`, which flattens `Contents/` into /Applications. Use:
#   dart run melos run dist-macos-pkg --no-select
# (`media_cli package-macos-pkg` — root = Release folder containing *.app).
# Optional: macos/packaging/pkg/make_config.yaml `install-path` for that command.
# Replace DEB/MSIX
# maintainer and signing options for real releases.

releases:
  - name: media-example
    jobs:
      - name: android-apk
        package:
          platform: android
          target: apk
      - name: android-aab
        package:
          platform: android
          target: aab
      - name: ios-ipa
        package:
          platform: ios
          target: ipa
      - name: linux-deb
        package:
          platform: linux
          target: deb
      - name: macos-dmg
        package:
          platform: macos
          target: dmg
      - name: windows-exe
        package:
          platform: windows
          target: exe
      - name: windows-msix
        package:
          platform: windows
          target: msix
