name: media_example
description: Example for the media package (probe / thumbnails / transcode).
publish_to: none
version: 0.1.0
resolution: workspace

# Prebuilts: `usePrebuild: true` copies from repo `platform-builds/` (populate via
# `dart run media_cli collect-native`). Omit both or set `usePrebuild: false` to
# download from the GitHub release instead.
hooks:
  user_defines:
    media_dart:
      localBuild: false
      usePrebuild: false

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  media_flutter: ^0.1.0
  # Same gallery UX on Android + iOS (photo_manager). Desktop still uses file_picker.
  wechat_assets_picker: ^9.4.0
  video_player: ^2.9.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fastforge: ^0.6.6

flutter:
  uses-material-design: true
