name: media_example
description: Example for the media package (probe / thumbnails / transcode).
publish_to: none
version: 0.1.2
resolution: workspace

# Native hook options for `media_dart` belong in the workspace root `pubspec.yaml`
# (`../../pubspec.yaml`): hooks_runner reads user_defines only from that file when
# using a Dart workspace. Prebuilts: `usePrebuild: true` + `platform-builds/`, or
# GitHub release; see `media_dart/hook/build.dart`.

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  media_flutter: ^0.1.2
  # Same gallery UX on Android + iOS (photo_manager). Desktop still uses file_picker.
  wechat_assets_picker: ^9.4.0
  video_player: ^2.9.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fastforge: ^0.6.6

flutter:
  uses-material-design: true
