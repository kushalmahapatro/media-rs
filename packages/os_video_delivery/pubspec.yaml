name: os_video_delivery
description: >
  OS-native video transcode, thumbnails, and WhatsApp-style delivery estimates
  for Android and Apple (iOS/macOS). No bundled FFmpeg on mobile.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.media_rs.os_video_delivery
        pluginClass: OsVideoDeliveryPlugin
      ios:
        pluginClass: OsVideoDeliveryPlugin
      macos:
        pluginClass: OsVideoDeliveryPlugin
