name: media
description: >
  Compatibility entrypoint: re-exports media_flutter so apps can use
  `package:media/media.dart` with `path: packages/media`.
version: 0.1.1
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

workspace:
  - media_dart
  - media_flutter
  - media_flutter/example
  - tool/cli
  - tool/native_build

dependencies:
  flutter:
    sdk: flutter
  media_flutter: ^0.1.1

dev_dependencies:
  melos: ^7.0.0

# Fastforge / unified_distributor: patched shell_executor (stdin), flutter_app_packager
# (macOS pkg productbuild root — see tool/patched/flutter_app_packager/.../app_package_maker_pkg.dart),
# tool/shims/appdmg → create-dmg.
dependency_overrides:
  shell_executor:
    path: tool/patched/shell_executor
  flutter_app_packager:
    path: tool/patched/flutter_app_packager

# Melos pipes child stderr through `logger.error()` ("ERROR:" prefix). Flutter also
# prefixes xcodebuild/ld stderr with "ERROR:" → double labels. Append `2>&1` on
# scripts below so build noise stays on stdout (still visible, not mislabeled).
melos:
  command:
    bootstrap:
      runPubGetInParallel: true
  scripts:
    analyze:
      description: Run dart analyze in each workspace package
      exec: dart analyze .
    test:
      description: Run dart test in media_dart (pure Dart package)
      exec: dart test
      packageFilters:
        scope: media_dart
    test:flutter:
      description: Run flutter test in media_flutter/example
      run: flutter test
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    codegen:
      description: Run build_runner in media_dart (Freezed, json_serializable, etc.)
      run: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        scope: media_dart
      exec:
        concurrency: 1
    mac-lib:
      description: Build macOS prebuilts (arm64 + x86_64) into platform-builds/
      run: cd tool/cli && dart run media_cli collect-native --package-root ../../media_dart -t aarch64-apple-darwin -t x86_64-apple-darwin
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    release-assets-macos:
      description: >
        macOS thin + universal libmedia zips and {triple}-ffmpeg.zip under release-assets/v0.1.1/
        (keep in sync with media_dart/hook/build.dart `version`).
      run: >
        cd tool/cli && dart run media_cli collect-native --package-root ../../media_dart
        -t aarch64-apple-darwin -t x86_64-apple-darwin
        --archive-format zip --archive-version v0.1.1
        --macos-universal --archive-ffmpeg zip 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    ios-lib:
      description: Build iOS prebuilts (device + simulators) into platform-builds/
      run: cd tool/cli && dart run media_cli collect-native --package-root ../../media_dart -t aarch64-apple-ios -t aarch64-apple-ios-sim -t x86_64-apple-ios
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    release-assets-android:
      description: >
        Build Android prebuilts and zip → release-assets/v0.1.1/ (needs ANDROID_NDK_HOME, rustup android targets).
      run: >
        cd tool/cli && dart run media_cli collect-native --package-root ../../media_dart
        -t aarch64-linux-android -t x86_64-linux-android -t armv7-linux-androideabi
        --archive-format zip --archive-version v0.1.1 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    release-assets-ios:
      description: >
        Zip existing platform-builds/ios/* → release-assets/v0.1.1/ (no FFmpeg; iOS uses system / AVFoundation).
      run: >
        cd tool/cli && dart run media_cli collect-native --package-root ../../media_dart
        --archive-only --archive-format zip --archive-version v0.1.1
        -t aarch64-apple-ios -t aarch64-apple-ios-sim -t x86_64-apple-ios 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    android-lib:
      description: Build Android prebuilts (arm64 + x86_64) into platform-builds/
      run: dart run media_cli collect-native -t aarch64-linux-android -t x86_64-linux-android -t armv7-linux-androideabi
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    linux-lib:
      description: Build Linux prebuilts (arm64 + x86_64) into platform-builds/
      # run: dart run media_cli collect-native -t aarch64-unknown-linux-gnu -t x86_64-unknown-linux-gnu
      run: dart run media_cli collect-native -t x86_64-unknown-linux-gnu
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    windows-lib:
      description: Build Windows prebuilts (arm64 + x86_64) into platform-builds/
      # run: dart run media_cli collect-native -t aarch64-pc-windows-msvc -t x86_64-pc-windows-msvc
      run: dart run media_cli collect-native -t x86_64-pc-windows-msvc
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    archive-prebuilts:
      description: >
        Zip each platform-builds/<os>/<triple>/ to release-assets/<triple>.zip
        (GitHub release assets). Add --archive-version v0.0.1 via extra args if needed.
      run: dart run media_cli collect-native --archive-only --archive-format zip
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    build-android:
      description: Build Android APK for media_flutter/example
      run: flutter build apk --release 2>&1
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    build-ios:
      description: Release iOS build for media_flutter/example (no codesign)
      run: flutter build ios --release --no-codesign 2>&1
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    build-linux:
      description: Build Linux release bundle for media_flutter/example
      run: flutter build linux --release 2>&1
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    build-macos:
      description: Build macOS release app for media_flutter/example
      run: flutter build macos --release 2>&1
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    build-windows:
      description: Build Windows release bundle for media_flutter/example
      run: flutter build windows --release 2>&1
      packageFilters:
        scope: media_example
      exec:
        concurrency: 1
    dist:
      description: Fastforge release — all jobs for media-example (artifacts under dist/)
      run: dart run media_cli dist --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-apk:
      description: Fastforge Android APK → dist/
      run: dart run media_cli dist --jobs android-apk --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-aab:
      description: Fastforge Android App Bundle (AAB) → dist/
      run: dart run media_cli dist --jobs android-aab --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-android:
      description: Fastforge Android APK + AAB → dist/
      run: dart run media_cli dist --jobs android-apk,android-aab --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-ipa:
      description: Fastforge iOS IPA → dist/
      run: dart run media_cli dist --jobs ios-ipa --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-linux-deb:
      description: Fastforge Linux .deb → dist/
      run: dart run media_cli dist --jobs linux-deb --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-macos-dmg:
      description: Fastforge macOS .dmg → dist/
      run: dart run media_cli dist --jobs macos-dmg --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-macos-pkg:
      description: macOS .pkg → dist/ (media_cli; `--no-build` skips flutter when Release/.app exists)
      run: dart run media_cli package-macos-pkg 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    publish-github-release:
      description: >
        Native + FFmpeg zips, tests, 3× macOS DMG/PKG, Android APK, upload to GitHub (needs gh auth; tag matches hook).
      run: bash tool/scripts/publish_media_rs_release.sh 2>&1
    dist-windows-exe:
      description: Fastforge Windows .exe → dist/
      run: dart run media_cli dist --jobs windows-exe --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
    dist-windows-msix:
      description: Fastforge Windows MSIX → dist/
      run: dart run media_cli dist --jobs windows-msix --skip-clean 2>&1
      packageFilters:
        scope: media_cli
      exec:
        concurrency: 1
